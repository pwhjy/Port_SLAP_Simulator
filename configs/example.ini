[DB]
; Values can be overridden with PORT_SLAP_DB_HOST, PORT_SLAP_DB_USERNAME,
; PORT_SLAP_DB_PASSWORD, PORT_SLAP_DB_PORT, PORT_SLAP_DB_NAME and
; PORT_SLAP_DB_CONTAINER.
HOST = 127.0.0.1
USERNAME = port_slap
; Demo-only credential matching compose.yaml. Override it with
; PORT_SLAP_DB_PASSWORD for any non-local deployment.
PASSWORD = port_slap_demo
PORT = 3306
DB = port_slap_demo
USER = port_slap_mysql


[RENDER]
